[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-moonshot-classifier"
version = "0.1.0"
description = "FIRE-moonshot-classifier: trajectory-based flight-stack fingerprinting"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Gayeon Lee" },
    { name = "Minjoon Lee" },
    { name = "Minhyun Cho" }
]

dependencies = [ 
    "torch", 
    "lightgbm", 
    "matplotlib", 
    "numpy", 
    "pandas", 
    "pymavlink", 
    "pyulog", 
    "PyWavelets", 
    "PyYAML", 
    "rdp", 
    "scikit-learn", 
    "scipy", 
    "seaborn", 
    "tqdm", 
    "tsfresh", 
    "wandb",
]

[project.scripts]
fireclassify = "fire_moonshot_classifier.cli:main"

# --- setuptools config for src/ layout ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
